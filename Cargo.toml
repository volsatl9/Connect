[workspace]
exclude = ["vendor"]
resolver = "3"
members = ["crates/proto", "crates/net", "crates/host", "crates/client", "crates/gpu-load", "crates/gpu-video", "crates/perf", "app"]

[workspace.package]
version = "0.11.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
connect-proto = { path = "crates/proto" }
connect-net = { path = "crates/net" }
connect-host = { path = "crates/host" }
connect-client = { path = "crates/client" }
connect-gpu-load = { path = "crates/gpu-load" }
connect-perf = { path = "crates/perf" }

anyhow = "1"
bytes = "1"
cpal = "0.17.3"
iroh = "1.4"
openh264 = "0.9"
opus = "0.4"
# Only the backends Connect draws with: Vulkan everywhere, plus Direct3D 12 and OpenGL on Windows and
# OpenGL on Linux (added per platform in connect-client), not wgpu's web and macOS backends.
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan"] }
gpu-video = { path = "crates/gpu-video", default-features = false }
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
lto = "fat"
codegen-units = 1
debug = 1

# Video encode/decode is unusably slow unoptimised; optimise deps even in dev builds.
[profile.dev.package."*"]
opt-level = 3

# noq-proto with one addition, a setter for BBR's ProbeRTT window gain. See vendor/noq-proto.
[patch.crates-io]
noq-proto = { path = "vendor/noq-proto" }
