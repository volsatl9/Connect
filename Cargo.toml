[workspace]
resolver = "3"
members = ["crates/proto", "crates/net", "crates/host", "crates/client", "app"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
connect-proto = { path = "crates/proto" }
connect-net = { path = "crates/net" }
connect-host = { path = "crates/host" }
connect-client = { path = "crates/client" }

anyhow = "1"
bytes = "1"
cpal = "0.17.3"
iroh = "1.4"
openh264 = "0.9"
opus = "0.4"
gpu-video = { version = "0.4", default-features = false }
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

# Video encode/decode is unusably slow unoptimised; optimise deps even in dev builds.
[profile.dev.package."*"]
opt-level = 3
